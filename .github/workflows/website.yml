name: Deploy iarbre.fr website

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: deploy-${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Deploy website
        uses: dawidd6/action-ansible-playbook@v9
        with:
          playbook: website.yml
          directory: deploy
          options: |
            -l ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
